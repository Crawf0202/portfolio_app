[project]
name = "portfolio_app"
version = "0.1.0"
description = "Will Crawford's portfolio, presented as an interactive file folder."
authors = [{ name = "Will Crawford" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask (>=3.0,<4.0)",
    "gunicorn (>=23.0,<24.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
