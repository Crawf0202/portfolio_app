<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} – {{ profile.name }}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="desk">
  <main class="container-lg py-4 py-md-5">
    <div class="folder">
      <!-- Folder tabs: each one is a server-rendered page -->
      <nav aria-label="Portfolio sections">
        <ul class="nav nav-tabs nav-fill flex-nowrap folder_tabs">
          {% for endpoint, label in tabs %}
          <li class="nav-item">
            <a class="nav-link{% if endpoint == active %} active{% endif %}"
               href="{{ url_for(endpoint) }}"
               {% if endpoint == active %}aria-current="page"{% endif %}>{{ label }}</a>
          </li>
          {% endfor %}
        </ul>
      </nav>

      <div class="folder_body p-2 p-sm-3 p-md-4">
        <section class="paper p-3 p-sm-4 p-lg-5">
          {% block content %}{% endblock %}
        </section>
      </div>
    </div>
    <footer class="text-center small mt-4 footer_text">© {{ year }} {{ profile.name }}</footer>
  </main>
</body>
</html>
